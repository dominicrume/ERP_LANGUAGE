id: made_to_order
industry: manufacturing_moto
title: "Made-to-Order Backlog"
narrative: >
  Your make-to-order backlog for {{product}} has grown beyond capacity.
  Decide how to sequence production and whether to subcontract overflow.
product_pool: ["custom cabinetry", "industrial pumps", "bespoke furniture"]
decisions:
  - id: sequencing
    label: "How do you sequence the backlog?"
    options: ["earliest_due_date", "shortest_job_first", "highest_margin_first"]
    scoring:
      earliest_due_date:
        impact:
          on_time_delivery: { points: 18 }
          margin: { points: -4 }
        reason: "Earliest due date protects the promise you already made, and leaves some margin on the table: {delta} pts."
      shortest_job_first:
        impact:
          on_time_delivery: { points: 6 }
          capacity_utilisation: { points: 8 }
        reason: "Shortest job first clears the queue and keeps the floor busy, while the big late orders keep slipping: {delta} pts."
      highest_margin_first:
        impact:
          margin: { points: 16 }
          on_time_delivery: { points: -8 }
        reason: "Highest margin first earns more per job and puts the due dates at risk: {delta} pts."
  - id: subcontract
    label: "Subcontract overflow capacity?"
    options: ["yes", "no"]
    scoring:
      "yes":
        impact:
          capacity_utilisation: { points: 20 }
          margin: { points: -18, scales_with: freight_expedite_multiplier }
        reason: "Subcontracting frees your own capacity, but inbound work in {locale} lands at the {freight_expedite_multiplier}x expedite rate: {delta} pts."
      "no":
        impact:
          on_time_delivery: { points: -12 }
          margin: { points: 4 }
        reason: "Keeping it in house protects margin while the backlog slips further past its due dates: {delta} pts."
kpi_weights: { on_time_delivery: 0.45, margin: 0.35, capacity_utilisation: 0.20 }
