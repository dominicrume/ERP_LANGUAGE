id: heatwave_demand
industry: manufacturing_distribution
title: "Heat Wave Demand Spike"
narrative: >
  A sudden heat wave has driven demand for {{product}} up sharply.
  Available stock cannot cover all open sales orders. You must decide
  which customers to prioritise for shipment and whether to pay for
  expedited freight to replenish stock faster.
product_pool: ["carbonated water", "bottled water", "ice cream", "electric fans"]
decisions:
  - id: customer_allocation
    label: "Which customers do you ship to first?"
    options: ["highest_value_first", "first_come_first_served", "strategic_accounts_first"]
    scoring:
      highest_value_first:
        impact:
          cash_position: { points: 15 }
          customer_satisfaction: { points: -5 }
        reason: "Shipping the highest-value orders first protects cash, at the cost of the smaller accounts waiting: {delta} pts."
      strategic_accounts_first:
        impact:
          cash_position: { points: 2 }
          customer_satisfaction: { points: 10 }
        reason: "Protecting strategic accounts keeps the relationships that matter most, with little cash benefit today: {delta} pts."
      first_come_first_served:
        impact:
          cash_position: { points: 0 }
          customer_satisfaction: { points: 2 }
        reason: "First come, first served is fair and simple, and moves neither cash nor satisfaction much: {delta} pts."
  - id: freight_choice
    label: "Standard or expedited freight for replenishment?"
    options: ["standard", "expedite"]
    scoring:
      standard:
        impact:
          overhead_cost: { points: 0 }
          customer_satisfaction: { points: -6 }
        reason: "Standard freight adds no premium, but stock arrives late and customers feel it: {delta} pts."
      expedite:
        impact:
          overhead_cost: { points: -40, scales_with: freight_expedite_multiplier }
          customer_satisfaction: { points: 12 }
        reason: "Expedite freight in {locale} carries a {freight_expedite_multiplier}x cost multiplier, bought back in service: {delta} pts."
kpi_weights: { cash_position: 0.4, customer_satisfaction: 0.35, overhead_cost: 0.25 }
