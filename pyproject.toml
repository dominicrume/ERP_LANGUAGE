[project]
name = "erpsim"
version = "1.1.0"
description = "ERP Decision Lab - operational decision-support training, localized"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "sqlmodel>=0.0.16",
                "pyyaml>=6.0", "python-multipart>=0.0.9"]
[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx"]
# Browser proof of the authoring flow (BREAK.md hat 2). After installing:
#     playwright install chromium
ui = ["pytest>=8.0", "httpx", "playwright>=1.40"]
# Proving SCALING.md #1: the same suite against a real Postgres.
postgres = ["pytest>=8.0", "httpx", "psycopg[binary]>=3.1"]
[tool.pytest.ini_options]
pythonpath = ["src"]
